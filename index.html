<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRF Vapocure Paints — Internal Tools</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B0A24;        /* deep version of the logo navy   */
    --navy-2:#14123B;
    --yellow:#FFD500;      /* logo yellow                     */
    --red:#E8232A;         /* logo red                        */
    --text:#F2F1FA;
    --muted:#8E8CB0;
    --line:rgba(242,241,250,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--navy);
    color:var(--text);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .wrap{max-width:1160px;margin:0 auto;padding:0 28px}

  /* ---------- ambient glow ---------- */
  .glow{
    position:fixed;inset:auto;width:70vmax;height:70vmax;border-radius:50%;
    filter:blur(120px);opacity:.13;pointer-events:none;z-index:0;
  }
  .glow.a{background:var(--yellow);top:-30vmax;right:-25vmax}
  .glow.b{background:var(--red);bottom:-35vmax;left:-25vmax;opacity:.08}

  /* ---------- header ---------- */
  header{position:relative;z-index:1;padding:44px 0 8px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .logo{height:118px;width:auto;animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes pop{from{opacity:0;transform:scale(.85) rotate(-6deg)}to{opacity:1;transform:none}}
  .badge{
    font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.18em;
    text-transform:uppercase;color:var(--navy);background:var(--yellow);
    padding:8px 14px;border-radius:999px;font-weight:500;white-space:nowrap;
    animation:rise .8s .3s cubic-bezier(.2,.8,.2,1) both;
  }
  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(2.4rem,7vw,4.6rem);
    font-weight:700;letter-spacing:-.03em;line-height:1.02;
    margin:34px 0 14px;
  }
  h1 .line{display:block;overflow:hidden}
  h1 .line span{display:inline-block;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
  h1 .line:nth-child(2) span{animation-delay:.12s;color:var(--yellow)}
  @keyframes rise{from{opacity:0;transform:translateY(110%)}to{opacity:1;transform:none}}
  .lede{color:var(--muted);max-width:52ch;font-size:1.02rem;animation:rise .8s .35s both}

  /* ---------- marquee ---------- */
  .marquee{
    margin:42px 0 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    overflow:hidden;white-space:nowrap;padding:10px 0;position:relative;z-index:1;
  }
  .marquee-track{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.72rem;
    letter-spacing:.22em;text-transform:uppercase;color:var(--muted);
    animation:scroll 28s linear infinite;
  }
  .marquee-track em{font-style:normal;color:var(--yellow);margin:0 .6em}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* ---------- project list ---------- */
  main{position:relative;z-index:1;padding:26px 0 80px}
  .group-label{
    font-family:'JetBrains Mono',monospace;font-size:.72rem;letter-spacing:.2em;
    text-transform:uppercase;color:var(--muted);margin:44px 0 6px;
    display:flex;align-items:center;gap:10px;
  }
  .group-label::after{content:"";height:1px;flex:1;background:var(--line)}

  .row{
    display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:20px;
    padding:26px 10px;border-bottom:1px solid var(--line);
    text-decoration:none;color:inherit;position:relative;isolation:isolate;
    opacity:0;transform:translateY(26px);
  }
  .row.in{animation:rowIn .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rowIn{to{opacity:1;transform:none}}
  .row::before{ /* yellow sweep on hover */
    content:"";position:absolute;inset:0;background:var(--yellow);
    transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.65,0,.35,1);
    z-index:-1;
  }
  .row:hover::before,.row:focus-visible::before{transform:scaleX(1)}
  .row:focus-visible{outline:none}
  .idx{
    font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--muted);
    transition:color .3s;
  }
  .title{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(1.5rem,4.2vw,2.6rem);
    font-weight:600;letter-spacing:-.02em;line-height:1.1;
    transition:color .3s, transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .desc{
    display:block;font-family:'Inter',sans-serif;font-size:.88rem;font-weight:400;
    letter-spacing:0;color:var(--muted);margin-top:6px;transition:color .3s;
  }
  .arrow{
    width:46px;height:46px;border:1px solid var(--line);border-radius:50%;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:all .35s cubic-bezier(.2,.8,.2,1);color:var(--text);
  }
  .row:hover .title,.row:focus-visible .title{color:var(--navy);transform:translateX(14px)}
  .row:hover .idx,.row:hover .desc,.row:focus-visible .idx,.row:focus-visible .desc{color:rgba(11,10,36,.65)}
  .row:hover .arrow,.row:focus-visible .arrow{
    background:var(--navy);border-color:var(--navy);color:var(--yellow);transform:rotate(-45deg);
  }

  footer{
    position:relative;z-index:1;border-top:1px solid var(--line);
    padding:26px 0 44px;color:var(--muted);font-size:.85rem;
    display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;
  }
  footer .wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;width:100%}
  footer b{color:var(--yellow);font-weight:500}

  @media (max-width:640px){
    .row{grid-template-columns:1fr auto;padding:22px 4px}
    .idx{display:none}
    .logo{height:84px}
  }
  @media (prefers-reduced-motion: reduce){
    *,.row{animation:none !important;transition:none !important;opacity:1 !important;transform:none !important}
    .marquee-track{animation:none}
  }
</style>
</head>
<body>

<div class="glow a"></div>
<div class="glow b"></div>

<header class="wrap">
  <div class="top">
    <img class="logo" src="logo.png" alt="MRF Vapocure Paints">
    <span class="badge">Internal · IT Dept</span>
  </div>
  <h1>
    <span class="line"><span>Every tool.</span></span>
    <span class="line"><span>One front door.</span></span>
  </h1>
  <p class="lede">All MRF Vapocure web tools in one place. Pick a project to open it — every tool works on desktop and mobile.</p>
</header>

<div class="marquee" aria-hidden="true">
  <span class="marquee-track" id="marquee"></span>
</div>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    <span>Built &amp; maintained by <b>IT · MRF Vapocure Paints</b>, Chennai</span>
    <span id="year"></span>
  </div>
</footer>

<script>
/* ============================================================
   EDIT HERE — the only part you need to touch.
   To add a tool: copy one { ... } block and change the details.
   To remove one: delete its block.
   ============================================================ */
const PROJECTS = [
  {
    name: "Field One",
    desc: "ISC attendance and field activity tracking — installable as a mobile app.",
    url: "https://mrfpaint.github.io/isc-tracker/",
    group: "Field & Sales"
  },
  {
    name: "Region-Wise Summary",
    desc: "MIS and sales analytics, summarised by region.",
    url: "https://mrfpaint.github.io/region-wise-summary/",
    group: "Field & Sales"
  },
  {
    name: "FSR Tracker — FSMS",
    desc: "Field service report tracking and management.",
    url: "https://mrfpaint.github.io/fsms/",
    group: "Quality & Compliance"
  },
  {
    name: "CIF Tracker",
    desc: "Complaint Investigation Form workflow — log, investigate, close.",
    url: "https://mrfpaint.github.io/cif-tracker/",
    group: "Quality & Compliance"
  },
  {
    name: "SCM — Insurance Tracker",
    desc: "Track supply-chain insurance claims from intimation to settlement.",
    url: "https://mrfpaint.github.io/insurance-tracker/",
    group: "Supply Chain & IT"
  },
  {
    name: "IT Helpdesk",
    desc: "Raise and track IT support tickets.",
    url: "https://mrfpaint.github.io/it-helpdesk/",
    group: "Supply Chain & IT"
  }
];
const GROUP_ORDER = ["Field & Sales", "Quality & Compliance", "Supply Chain & IT"];
/* ================= end of the edit zone ===================== */

/* marquee text */
const names = PROJECTS.map(p => p.name).join(" <em>✦</em> ");
document.getElementById("marquee").innerHTML =
  (names + " <em>✦</em> MRF Vapocure Paints <em>✦</em> ").repeat(2);

/* build rows */
const app = document.getElementById("app");
let n = 0;
for (const group of GROUP_ORDER) {
  const tools = PROJECTS.filter(p => p.group === group);
  if (!tools.length) continue;

  const label = document.createElement("div");
  label.className = "group-label";
  label.textContent = group;
  app.appendChild(label);

  for (const t of tools) {
    n++;
    const a = document.createElement("a");
    a.className = "row";
    a.href = t.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = `
      <span class="idx">${String(n).padStart(2,"0")}</span>
      <span class="title">${t.name}<span class="desc">${t.desc}</span></span>
      <span class="arrow" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>`;
    app.appendChild(a);
  }
}

/* staggered entrance as rows scroll into view */
const rows = document.querySelectorAll(".row");
const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add("in");
      io.unobserve(e.target);
    }
  });
}, {threshold:.15});
rows.forEach((r,i) => { r.style.animationDelay = (0.45 + i*0.09) + "s"; io.observe(r); });

document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
